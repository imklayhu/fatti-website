<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#f7f5f0"/>

  <!-- 左上角小标题 -->
  <text x="48" y="56" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" fill="#243147">技术栈关系图 · 第一眼认识</text>

  <!-- AI 编程工具横条 -->
  <rect x="48" y="80" width="1104" height="112" rx="16" fill="#ffffff" stroke="#c81e3a" stroke-width="3"/>
  <text x="84" y="128" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#243147">AI 编程工具（Cursor + LLM API）</text>
  <text x="84" y="166" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#5c6b7a">用自然语言让 AI 帮你写代码、改代码、解释代码</text>
  <text x="1116" y="141" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#c81e3a" text-anchor="end">帮你写代码 ↓</text>

  <!-- 前端卡 -->
  <rect x="96" y="236" width="440" height="248" rx="16" fill="#ffffff" stroke="#243147" stroke-width="3"/>
  <rect x="128" y="262" width="110" height="36" rx="8" fill="#e6b422"/>
  <text x="128" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#243147">前端</text>
  <text x="128" y="380" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#5c6b7a">小程序界面：用户看到的一切</text>
  <text x="128" y="420" font-family="Menlo, monospace" font-size="22" font-weight="600" fill="#243147">Taro + React + TypeScript</text>
  <text x="128" y="462" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c81e3a">跑在用户手机里</text>

  <!-- 前端 → 后端 箭头 -->
  <line x1="536" y1="360" x2="652" y2="360" stroke="#5c6b7a" stroke-width="3"/>
  <polygon points="664,360 648,352 648,368" fill="#5c6b7a"/>

  <!-- 后端卡 -->
  <rect x="664" y="236" width="440" height="248" rx="16" fill="#ffffff" stroke="#243147" stroke-width="3"/>
  <text x="696" y="342" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#243147">后端</text>
  <text x="696" y="380" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#5c6b7a">负责计算的逻辑：生成控卡单</text>
  <text x="696" y="420" font-family="Menlo, monospace" font-size="22" font-weight="600" fill="#243147">FastAPI + Python</text>
  <text x="696" y="462" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c81e3a">跑在云服务器里</text>

  <!-- 后端 → 数据库 折线箭头 -->
  <polyline points="884,484 884,506 600,506 600,508" fill="none" stroke="#5c6b7a" stroke-width="3"/>
  <polygon points="600,520 592,504 608,504" fill="#5c6b7a"/>

  <!-- 数据库卡 -->
  <rect x="330" y="520" width="540" height="96" rx="16" fill="#fff4e0" stroke="#243147" stroke-width="3"/>
  <text x="370" y="562" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#243147">数据库</text>
  <text x="370" y="596" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#5c6b7a">存用户数据：题库、档案、打卡记录</text>
  <text x="830" y="596" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#c81e3a" text-anchor="end">PostgreSQL · 服务器里的仓库</text>
</svg>
